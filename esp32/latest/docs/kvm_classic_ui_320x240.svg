<style>text{fill:#111;font-family:"Courier New",monospace;font-weight:700;letter-spacing:.15px}.screen{fill:url(#d);stroke:#111;stroke-width:2}.menu,.panel{fill:#fff;stroke:#111}.panel{stroke-width:2;filter:url(#h)}.bar{fill:url(#s);stroke:#111}.cut{fill:#eee}.t7{font-size:7px}.t8{font-size:8px}.t9{font-size:9px}.t12{font-size:12px}.t18{font-size:18px}.t22{font-size:22px}.n{font-weight:400}.r{text-anchor:end}.c{text-anchor:middle}.w{fill:#fff}.blk{fill:#111}.ln{stroke:#111;fill:none}.g{fill:#777}.inv{fill:#111;stroke:#111}.box{fill:#fff;stroke:#111}.off{fill:url(#x);stroke:#111}</style>
</defs>
<rect width="704" height="536" fill="#e5e5e1"/><text x="32" y="27" class="t12">KVM DESK / CLASSIC SINGLE-SCREEN PREVIEW</text><text x="32" y="44" class="t8 n">320 × 240 logical pixels · 2× preview · middle key rotates only LIVE DATA</text>
